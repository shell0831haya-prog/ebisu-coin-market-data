name: Update market data

on:
  schedule:
    - cron: "20 23 * * *"   # 23:20 UTC = 翌朝 8:20 JST
  workflow_dispatch: {}      # 手動実行も可

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest prices
        run: python3 fetch_data.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- lbma_data.json; then
            echo "変化なし（休場日など）、pushスキップ"
            exit 0
          fi
          git config user.name "ebisu-coin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lbma_data.json
          git commit -m "Update market data $(date -u -d '+9 hours' '+%Y-%m-%d')"
          git push
